name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check src tests scripts

      - name: Run tests
        run: pytest -q

      - name: Smoke test ingestion and retrieval
        env:
          RAG_EMBEDDING_BACKEND: hashing
          RAG_QDRANT_PATH: .ci-qdrant
          RAG_DATABASE_URL: sqlite:///./ci.db
          RAG_ARTIFACT_DIR: ./ci-artifacts
        run: |
          python scripts/make_sample_documents.py
          python scripts/seed_documents.py --backend hashing
          python scripts/evaluate.py --backend hashing --limit 3

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build
