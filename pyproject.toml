[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag_assistant"
version = "1.0.0"
description = "Enterprise RAG knowledge assistant with citations, conversation history and retrieval evaluation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Deepak Tripathi" }]
keywords = ["rag", "llm", "qdrant", "fastapi", "sentence-transformers", "ai-engineering"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0,<7"]
dev = ["pytest>=8.2,<10", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
# FastAPI's dependency injection requires the File() call in the signature.
"src/rag_assistant/api/main.py" = ["B008"]
