services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: sourceiq-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sourceiq-postgres
    environment:
      POSTGRES_USER: sourceiq
      POSTGRES_PASSWORD: sourceiq
      POSTGRES_DB: sourceiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sourceiq -d sourceiq"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
    image: sourceiq-api:latest
    container_name: sourceiq-api
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      SOURCEIQ_DATA_DIR: /app/data
      SOURCEIQ_ARTIFACT_DIR: /app/artifacts
      SOURCEIQ_QDRANT_URL: http://qdrant:6333
      SOURCEIQ_DATABASE_URL: postgresql+psycopg://sourceiq:sourceiq@postgres:5432/sourceiq
      SOURCEIQ_EMBEDDING_BACKEND: sentence-transformers
      SOURCEIQ_LLM_PROVIDER: ${SOURCEIQ_LLM_PROVIDER:-auto}
      SOURCEIQ_LLM_API_KEY: ${SOURCEIQ_LLM_API_KEY:-}
      SOURCEIQ_LLM_MODEL: ${SOURCEIQ_LLM_MODEL:-gpt-4o-mini}
      SOURCEIQ_SEED_DEMO: "1"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: sourceiq-frontend:latest
    container_name: sourceiq-frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
