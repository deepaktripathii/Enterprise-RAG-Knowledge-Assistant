services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: rag_assistant-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: rag_assistant-postgres
    environment:
      POSTGRES_USER: rag_assistant
      POSTGRES_PASSWORD: rag_assistant
      POSTGRES_DB: rag_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_assistant -d rag_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
    image: rag_assistant-api:latest
    container_name: rag_assistant-api
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      RAG_DATA_DIR: /app/data
      RAG_ARTIFACT_DIR: /app/artifacts
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_DATABASE_URL: postgresql+psycopg://rag_assistant:rag_assistant@postgres:5432/rag_assistant
      RAG_EMBEDDING_BACKEND: sentence-transformers
      RAG_LLM_PROVIDER: ${RAG_LLM_PROVIDER:-auto}
      RAG_LLM_API_KEY: ${RAG_LLM_API_KEY:-}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-gpt-4o-mini}
      RAG_SEED_DEMO: "1"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: rag_assistant-frontend:latest
    container_name: rag_assistant-frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
